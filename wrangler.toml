name = "auditoria-pay"
main = "index.js"
compatibility_date = "2024-09-01"

# Le site (index.html, activated.html) est servi par ce même Worker depuis le dossier public/ :
# même domaine que l'API, donc cookies de session et appels /auth, /upload... fonctionnent sans CORS.
[assets]
directory = "./public"

[[d1_databases]]
binding = "AUDITORIA_DB"
database_name = "auditoria_db"
database_id = "067dfe5b-d3f0-4092-8e48-ad44551297de"

# R2 : stockage des fichiers de plus de ~1,4 Mo (au-delà, D1 refuserait la ligne — voir README,
# section "Fichiers volumineux (R2)"). Les petits fichiers restent en D1 comme avant, inchangé.
# Avant de déployer : crée le bucket une fois (`wrangler r2 bucket create auditoria-documents`),
# ce qui exige une carte bancaire/PayPal sur le compte Cloudflare, même pour rester dans le tier
# gratuit de R2. Tant que le bucket n'existe pas, le code refuse proprement les fichiers trop gros
# (message clair), sans casser le reste du site.
[[r2_buckets]]
binding = "AUDITORIA_BUCKET"
bucket_name = "auditoria-documents"

# Logs du Worker visibles dans le dashboard Cloudflare (les erreurs détaillées y sont écrites,
# elles ne sont plus renvoyées au navigateur).
[observability]
enabled = true

# Secrets, ne pas mettre en clair ici :
# wrangler secret put OPENROUTER_API_KEY
# wrangler secret put NOWPAYMENTS_API_KEY
# wrangler secret put IPN_SECRET
# Email de réinitialisation (optionnel, un seul des deux suffit) :
#   Brevo  : wrangler secret put BREVO_API_KEY  + variable EMAIL_SENDER (adresse expéditrice validée dans Brevo)
#   Resend : wrangler secret put RESEND_API_KEY + variable EMAIL_FROM ci-dessous
# Sans aucune clé d'email, le lien de réinitialisation est seulement écrit dans les logs du Worker.

[vars]
APP_URL = "https://auditoria-pay.promptforgeai.workers.dev"
# Expéditeur des emails de réinitialisation (Resend). onboarding@resend.dev fonctionne sans domaine,
# mais Resend n'envoie alors qu'à l'adresse de ton propre compte Resend. Pour écrire à tes clients,
# vérifie un domaine à toi dans Resend puis mets ici par ex. "AuditorIA <no-reply@tondomaine.com>".
EMAIL_FROM = "AuditorIA <onboarding@resend.dev>"
