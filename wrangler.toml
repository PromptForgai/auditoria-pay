name = "auditoria-pay"
main = "index.js"
compatibility_date = "2024-09-01"

# Le site (index.html, activated.html) est servi par ce même Worker depuis le dossier public/ :
# même domaine que l'API, donc cookies de session et appels /auth, /upload... fonctionnent sans CORS.
[assets]
directory = "./public"

[[d1_databases]]
binding = "AUDITORIA_DB"
database_name = "auditoria_db"
database_id = "067dfe5b-d3f0-4092-8e48-ad44551297de"

# R2 désactivé pour l'instant : son activation exige une carte bancaire/PayPal chez Cloudflare,
# même pour rester dans le tier gratuit. Les fichiers sont stockés directement en D1 en attendant
# (colonne documents.content_base64). Pour réactiver R2 plus tard :
# [[r2_buckets]]
# binding = "AUDITORIA_BUCKET"
# bucket_name = "auditoria-documents"        # `wrangler r2 bucket create auditoria-documents`

# Secrets, ne pas mettre en clair ici :
# wrangler secret put GEMINI_API_KEY
# wrangler secret put NOWPAYMENTS_API_KEY
# wrangler secret put IPN_SECRET
# (RESEND_API_KEY optionnel, pour l'email de réinitialisation de mot de passe)

[vars]
APP_URL = "https://auditoria-pay.promptforgeai.workers.dev"
# Expéditeur des emails de réinitialisation (Resend). onboarding@resend.dev fonctionne sans domaine,
# mais Resend n'envoie alors qu'à l'adresse de ton propre compte Resend. Pour écrire à tes clients,
# vérifie un domaine à toi dans Resend puis mets ici par ex. "AuditorIA <no-reply@tondomaine.com>".
EMAIL_FROM = "AuditorIA <onboarding@resend.dev>"
