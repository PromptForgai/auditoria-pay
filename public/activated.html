<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment status — AuditorIA</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#070b14;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;margin:0}
.card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:40px;max-width:440px;width:100%;text-align:center}
.icon{width:64px;height:64px;background:rgba(245,158,11,.15);color:#f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px}
.icon.ok{background:rgba(16,185,129,.15);color:#10b981}
.icon.err{background:rgba(239,68,68,.15);color:#ef4444}
h1{font-size:1.5rem;margin:0 0 12px}
p{color:#94a3b8;line-height:1.6;margin:0 0 16px}
.plan{font-weight:700;color:#10b981;font-size:1.1rem;margin-bottom:8px}
.btn{display:inline-block;background:#10b981;color:#fff;padding:14px 28px;border-radius:8px;font-weight:600;text-decoration:none;margin-top:8px}
.note{font-size:.8rem;margin-top:24px;padding-top:20px;border-top:1px solid #1e293b;color:#64748b;line-height:1.5}
.status{font-size:.9rem;color:#f59e0b;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">…</div>
  <h1 id="title">Checking your payment…</h1>
  <div class="plan" id="planName"></div>
  <p class="status" id="status">This can take a few minutes to confirm on-chain.</p>
  <p id="msg">Please don't close this page yet.</p>
  <a class="btn" href="app.html" id="dashBtn" style="display:none">Open dashboard</a>
  <div class="note">Subscriptions are activated automatically as soon as the payment is confirmed by
  our server — this page only reflects that status, it never activates anything on its own.</div>
</div>
<script>
(function(){
  // API_BASE : laisse "" si ce Worker est sur le même domaine que le site (voir app.html).
  var API_BASE = "";
  var params = new URLSearchParams(location.search);
  var orderId = params.get("order_id");
  var attempts = 0;

  function showError(msg){
    document.getElementById("icon").className = "icon err";
    document.getElementById("icon").textContent = "!";
    document.getElementById("title").textContent = "Couldn't verify payment";
    document.getElementById("status").textContent = "";
    document.getElementById("msg").textContent = msg;
    document.getElementById("dashBtn").style.display = "inline-block";
    document.getElementById("dashBtn").textContent = "Back to sign in";
  }

  function showPaid(plan){
    document.getElementById("icon").className = "icon ok";
    document.getElementById("icon").textContent = "✓";
    document.getElementById("title").textContent = "Subscription activated";
    document.getElementById("planName").textContent = (plan === "growth" ? "Growth" : "Starter") + " — 30 days";
    document.getElementById("status").textContent = "";
    document.getElementById("msg").textContent = "Your monthly access is active. Open the dashboard and sign in to continue.";
    document.getElementById("dashBtn").style.display = "inline-block";
  }

  // Il n'existe AUCUN chemin dans ce script qui active un abonnement lui-même : il ne fait que
  // lire /status, qui lit lui-même la table `orders` en base, mise à jour uniquement par /ipn
  // après vérification de la signature NOWPayments. Pas d'order_id, pas d'activation possible ici.
  async function check(){
    if (!orderId) { showError("No order reference found in the link. If you just paid, check your email for the confirmation link, or contact support."); return; }
    attempts++;
    try {
      var res = await fetch(API_BASE + "/status?order_id=" + encodeURIComponent(orderId));
      var data = await res.json();
      if (data.paid) { showPaid(data.plan); return; }
      if (data.status === "not_found") { showError("We couldn't find this order. Contact support if you were charged."); return; }
      document.getElementById("status").textContent = "Status: " + (data.status || "pending");
      if (attempts > 24) { showError("Still not confirmed after a few minutes. If you completed the payment, it may still arrive shortly — contact support with your order reference: " + orderId); return; }
      setTimeout(check, 5000);
    } catch(e) {
      if (attempts > 3) { showError("Couldn't reach the server. Please retry in a moment."); return; }
      setTimeout(check, 5000);
    }
  }
  check();
})();
</script>
</body>
</html>
